<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ad Press</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e5252c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="deck">
  <div class="wrap">
    <div class="bar">
      <span class="dot" aria-hidden="true"></span>
      <span class="nm">Ad Press</span>
      <span class="sub">reads the site, then draws</span>
    </div>

    <form id="form" novalidate>
      <div class="row1">
        <div class="f">
          <label for="site">Website</label>
          <input id="site" type="url" inputmode="url" spellcheck="false" autocomplete="off"
                 placeholder="https://example.com">
        </div>
        <button id="scan" type="submit" class="btn primary">Read it</button>
      </div>
      <div class="f">
        <label for="ref">Your own line <span class="o">optional</span></label>
        <input id="ref" type="text" spellcheck="false"
               placeholder="One short line to use instead of the site's own">
      </div>
      <p class="hint" id="scanhint">Any public URL.</p>
    </form>
  </div>
</header>

<section id="found" class="panel" hidden>
  <div class="wrap">
    <div class="fgrid" id="fgrid"></div>
  </div>
</section>

<section id="setup" class="panel setup" hidden>
  <div class="wrap">
    <div class="cols">
      <div>
        <h2 class="lab">Ratios</h2>
        <div id="ratios" class="ratios"></div>
        <p class="foot" id="rationote"></p>
      </div>
      <div>
        <h2 class="lab">Text on the image</h2>
        <div id="textmodes" class="modes"></div>
        <p class="foot" id="modenote"></p>

        <h2 class="lab sp">Versions each</h2>
        <div id="pervals" class="steps" role="group" aria-label="Versions per ratio"></div>
      </div>
    </div>

    <div class="act">
      <output id="tally">nothing selected</output>
      <div class="go">
        <button id="go" type="button" class="btn primary" disabled>Generate</button>
        <button id="dlall" type="button" class="btn ghost" disabled>Download all</button>
      </div>
    </div>
    <div class="prog" id="prog" hidden><i id="progfill"></i></div>
  </div>
</section>

<section id="verdict" class="panel verdict" hidden>
  <div class="wrap"><div id="vgrid" class="vgrid"></div></div>
</section>

<main id="out" class="proof"></main>

<footer>
  <div class="wrap">
    <details id="rules">
      <summary>What this follows, and what it refuses</summary>
      <div id="rulebody"></div>
    </details>
  </div>
</footer>

<script src="spec.js"></script>
<script src="compose.js"></script>
<script src="check.js"></script>
<script src="app.js"></script>
<script type="module" src="ui.js"></script>
</body>
</html>
