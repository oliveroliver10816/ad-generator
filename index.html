<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ad Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23106f62'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f5c37a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="logo"><span class="dot"></span> Ad&nbsp;Studio</div>
    <span class="whoami" id="whoami"></span>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <h1 class="rise" style="--d:0ms">Give it a website.<br>Get a set of ads.</h1>
      <p class="sub rise" style="--d:70ms">It reads the site, works out what the business is,
        writes the concept, and lays the ads out for you. Everything on one screen — set it
        all here and press go once.</p>
    </div>
  </section>

  <section class="panel">
    <div class="wrap">
      <form id="form" novalidate>

        <div class="q rise" style="--d:140ms">
          <div class="qh"><span class="n">1</span><label for="site">Which website?</label></div>
          <input id="site" type="url" inputmode="url" spellcheck="false" autocomplete="off"
                 placeholder="yourbusiness.com">
        </div>

        <div class="q rise" style="--d:200ms">
          <div class="qh"><span class="n">2</span><label for="ref">Anything you want it to say?</label>
            <span class="opt">optional</span></div>
          <input id="ref" type="text" spellcheck="false"
                 placeholder="One short line — we'll use yours ahead of the site's own words">
        </div>

        <div class="q rise" style="--d:260ms">
          <div class="qh"><span class="n">3</span><label>Which sizes?</label>
            <button type="button" class="mini" id="allsizes">all</button></div>
          <div id="ratios" class="ratios"></div>
        </div>

        <div class="q rise" style="--d:320ms">
          <div class="qh"><span class="n">4</span><label>How many of each?</label></div>
          <div id="counts" class="counts" role="group" aria-label="How many of each size"></div>
        </div>

        <div class="q rise" style="--d:380ms">
          <div class="qh"><span class="n">5</span><label>Words on the picture?</label></div>
          <div id="modes" class="modes"></div>
        </div>

        <div class="go rise" style="--d:440ms">
          <button id="run" type="submit" class="btn">Make my ads</button>
          <span class="tally" id="tally"></span>
        </div>
      </form>
    </div>
  </section>

  <section id="steps" class="steps" hidden>
    <div class="wrap"><ol id="steplist"></ol></div>
  </section>

  <section id="report" class="report" hidden>
    <div class="wrap"><div id="reportgrid" class="rg"></div></div>
  </section>

  <section id="out" class="out"></section>
</main>

<footer>
  <div class="wrap">
    <button type="button" class="link" id="rulesbtn">What this follows, and what it won't do</button>
    <div id="rules" class="rules" hidden></div>
  </div>
</footer>

<script src="spec.js"></script>
<script src="compose.js"></script>
<script src="check.js"></script>
<script src="app.js"></script>
<script type="module" src="ui.js"></script>
</body>
</html>
